slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /pulso/navigation/scan
    resolution: 0.05
    min_laser_range: 0.10
    max_laser_range: 5.0
    minimum_time_interval: 0.15
    transform_publish_period: 0.05
    map_update_interval: 0.5
    # VIO can begin with a pure rotation. Accept the first tiny translation so
    # slam_toolbox materializes its cropped OccupancyGrid immediately instead
    # of waiting for drift to cross a rover-scale distance threshold.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.035
    scan_buffer_size: 12
    scan_buffer_maximum_scan_distance: 5.0
    link_match_minimum_response_fine: 0.08
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.5
    do_loop_closing: true
    use_scan_matching: true
    use_scan_barycenter: true
    enable_interactive_mode: false
    debug_logging: false
